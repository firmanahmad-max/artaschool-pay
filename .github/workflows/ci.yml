name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint, typecheck & build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  # Jaring pengaman yang TIDAK butuh database — wajib jalan tiap perubahan,
  # supaya perlindungan yang sudah dibangun tidak diam-diam rusak.
  jaring-pengaman:
    name: Privasi (UU PDP) & aksesibilitas
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Penyaring data pribadi laporan error
        run: npm run test:scrub
      - name: Kontras WCAG 2.1 AA (kedua tema)
        run: npm run audit:kontras
      - name: Interpretasi respons gateway WhatsApp (WAHA)
        run: npm run test:gateway
      - name: Kredensial wali (OTP, PIN, kode aktivasi)
        run: npm run test:auth
      - name: Statistik perangkat anonim (tanpa data pribadi)
        run: npm run test:perangkat

  database:
    name: Validasi skema PostgreSQL 16
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: artaschool
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - name: Stub skema auth Supabase
        run: psql -h localhost -U postgres -d artaschool -v ON_ERROR_STOP=1 -f supabase/ci/auth_stub.sql
      - name: Jalankan migrations
        run: |
          for f in supabase/migrations/*.sql; do
            echo "== $f"
            psql -h localhost -U postgres -d artaschool -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Jalankan seed
        run: psql -h localhost -U postgres -d artaschool -v ON_ERROR_STOP=1 -f supabase/seed.sql
      - name: Tes logika keuangan (RPC, trigger, batas peran)
        run: psql -h localhost -U postgres -d artaschool -v ON_ERROR_STOP=1 -f supabase/tests/rpc_test.sql
      - name: Pastikan proteksi kritis terpasang
        run: |
          psql -h localhost -U postgres -d artaschool -v ON_ERROR_STOP=1 -c "
            do \$\$
            begin
              -- payments tidak boleh punya policy UPDATE bagi siapa pun
              if exists (select 1 from pg_policies
                         where tablename='payments' and cmd in ('UPDATE','ALL')) then
                raise exception 'payments punya policy UPDATE — status hanya boleh lewat RPC';
              end if;
              -- audit_logs wajib append-only
              if not exists (select 1 from pg_trigger
                             where tgname='audit_logs_immutable') then
                raise exception 'trigger append-only audit_logs hilang';
              end if;
              -- RLS wajib aktif di SEMUA tabel public (tabel baru ikut tercek;
              -- daftar tetap terbukti tertinggal saat tabel ditambah)
              if exists (select 1 from pg_class c join pg_namespace n on n.oid=c.relnamespace
                         where n.nspname='public' and c.relkind='r' and not c.relrowsecurity) then
                raise exception 'ada tabel public tanpa RLS: %', (
                  select string_agg(c.relname, ', ') from pg_class c
                  join pg_namespace n on n.oid=c.relnamespace
                  where n.nspname='public' and c.relkind='r' and not c.relrowsecurity);
              end if;
            end \$\$;"

  # Supabase lokal SUNGGUHAN (auth, PostgREST, storage, RLS, hak EXECUTE) —
  # menangkap kelas masalah yang lolos dari validasi Postgres polos di atas:
  # RPC yang terbuka untuk anon, isolasi antar-wali lewat sesi nyata, siklus
  # SPP ujung-ke-ujung, dan restore backup yang diam-diam membuka celah.
  supabase:
    name: Pentest, UAT & backup drill (Supabase lokal)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Nilai tiruan: nomor uji memakai OTP tetap ([auth.sms.test_otp]),
      # hook send_sms tidak pernah dipanggil di sini. CLI menolak secret
      # yang bagian base64-nya < 32 karakter.
      SEND_SMS_HOOK_SECRET: "v1,whsec_dGVzdC1jaS1zZW5kLXNtcy1ob29rLXNlY3JldC1hcnRhc2Nob29sLXBheQ=="
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - name: Jalankan Supabase lokal (migrasi + seed dari nol)
        run: supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Tulis .env.local dari kunci demo lokal
        run: |
          supabase status -o env \
            | sed -n 's/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/p; s/^ANON_KEY=/NEXT_PUBLIC_SUPABASE_ANON_KEY=/p; s/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/p' \
            | tr -d '"' > .env.local
          cut -d= -f1 .env.local
      - name: Pentest (sesi wali & anon nyata)
        run: npm run pentest
      - name: UAT siklus SPP penuh
        run: npm run uat
      - name: Backup drill (data + paritas keamanan)
        run: npm run backup:drill
